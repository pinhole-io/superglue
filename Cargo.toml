# Superglue monorepo: core + bindings share one version and develop in lockstep.
# Bump `[workspace.package].version` here only; run `scripts/sync-superglue-versions.sh`.

[workspace]
resolver = "2"
members = [
    ".",
    "superglue-js",
    "superglue-py",
    "superglue-kt/native",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-4-Clause"

[profile.release]
lto = true
strip = true

[package]
name = "superglue"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Superglue library and CLI"

[features]
# Enables the tonic gRPC server in `src/grpc/`.
grpc = ["dep:tonic", "dep:tonic-prost", "dep:tokio-stream"]
# Enables the Prometheus metrics exporter.
prometheus = ["dep:metrics-exporter-prometheus"]
# Enables the OTLP span exporter via tracing-opentelemetry.
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
mcp = ["dep:rmcp", "dep:http", "dep:chrono"]
# Enables the axum HTTP LLM gateway server in `src/gateway/`.
gateway = ["dep:axum", "dep:tower", "dep:tower-http", "dep:rusqlite", "dep:chrono", "dep:subtle", "dep:tokio-stream", "dep:rust-embed"]
# Enables optional LLM traffic capture (gzip spool + S3 upload) on the gateway.
capture = ["gateway", "dep:aws-config", "dep:aws-sdk-s3", "dep:aws-smithy-async", "dep:flate2"]
# Enables the programmatic JavaScript tool mode.
code = ["dep:boa_engine"]
# Enables provider-agnostic realtime voice sessions over WebSocket.
realtime = ["dep:rustls", "dep:tokio-tungstenite", "dep:url"]

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
# tonic-prost-build generates gRPC stubs when the `grpc` feature is enabled.
tonic-prost-build = "0.14"

[dependencies]
async-trait = "0.1"
boa_engine = { version = "0.21", optional = true }
prost = "0.14"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
governor = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "stream",
    "multipart",
    "query",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "io-std", "macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = { version = "0.33", optional = true }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", optional = true }
secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1"
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
tokio-stream = { version = "0.1", optional = true }
rust-embed = { version = "8", optional = true }
uuid = { version = "1", features = ["v4"] }
regex = "1.13.1"
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"], optional = true }
rmcp = { version = "2.2", optional = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
http = { version = "1", optional = true }
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock", "std"] }
base64 = "0.22"
sha2 = "0.11"
axum = { version = "0.8", optional = true, features = ["multipart"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", optional = true, features = ["trace"] }
rusqlite = { version = "0.40", optional = true, features = ["bundled"] }
subtle = { version = "2", optional = true }
aws-config = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest", "rustls"] }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["rustls"] }
aws-smithy-async = { version = "1", optional = true, features = ["rt-tokio"] }
flate2 = { version = "1", optional = true }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"], optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
url = { version = "2.5.8", optional = true }

[[example]]
name = "28_mcp_tools"
path = "examples/28_mcp_tools.rs"
required-features = ["mcp"]

[[example]]
name = "35_code_tool_mode"
path = "examples/35_code_tool_mode.rs"
required-features = ["code"]

[[example]]
name = "36_realtime_voice"
path = "examples/36_realtime_voice.rs"
required-features = ["realtime"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
tempfile = "3"
criterion = { version = "0.8", features = ["async_tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
flate2 = "1"

[[test]]
name = "gateway"
path = "tests/gateway.rs"
required-features = ["gateway"]

[[test]]
name = "gateway_capture"
path = "tests/gateway_capture.rs"
required-features = ["capture"]

[[test]]
name = "gateway_cli"
path = "tests/gateway_cli.rs"
required-features = ["gateway"]

[[test]]
name = "context_optimization_wiremock"
path = "tests/context_optimization_wiremock.rs"
required-features = ["code"]

[[test]]
name = "context_optimization_benchmark"
path = "tests/context_optimization_benchmark.rs"
required-features = ["code"]

[[bench]]
name = "context_optimization"
harness = false
required-features = ["code"]

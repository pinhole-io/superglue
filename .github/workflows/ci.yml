name: superglue

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --features mcp,gateway
      - run: cargo test --features grpc --lib
      - name: Generate proto stubs
        run: |
          python3 -m venv .venv-proto
          # Pin must match GRPC_GENERATED_VERSION in committed stubs.
          .venv-proto/bin/pip install 'grpcio-tools==1.83.0' --quiet
          bash scripts/generate-proto-clients.sh
      - name: Verify generated Python proto stubs are committed
        run: git diff --exit-code superglue-py/superglue/grpc/

  superglue-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: superglue-js
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: superglue-js/package-lock.json
      - run: npm ci
      - run: npm run build:native:debug
      - run: npm run build:ts
      - run: node test/run.mjs

  superglue-py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: superglue-py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.12 and create venv
        run: |
          uv python install 3.12
          uv venv --python 3.12
      - name: Install maturin and pytest
        run: uv pip install maturin pytest
      - name: Build and install extension
        run: .venv/bin/maturin develop --profile dev
      - name: Run tests
        run: .venv/bin/pytest

  superglue-kt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: superglue-kt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36"
      - name: Run host unit tests
        run: ./gradlew :superglue-android:testDebugUnitTest --no-daemon

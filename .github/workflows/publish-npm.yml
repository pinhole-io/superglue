# Build the napi-rs targets and publish superglue-js to npm.
# A GitHub Release tagged v<version> starts the job.
# workflow_dispatch builds the same binaries. Set publish to upload them.
# napi prepublish also uploads each .node file to that GitHub release.

name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload this commit to npm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

env:
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the release tag to match the workspace version
        if: github.event_name == 'release' || inputs.publish
        run: bash scripts/require-release-tag.sh

  build:
    needs: guard
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
    defaults:
      run:
        working-directory: superglue-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: superglue-js/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-
      - run: npm ci
      - name: Build the native addon
        run: npm run build:native -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: superglue-js/superglue-js.*.node
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: superglue-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: superglue-js/package-lock.json
      - run: npm ci
      - run: npm run build:ts
      - run: npx napi create-npm-dirs
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          merge-multiple: true
          path: superglue-js/artifacts
      - run: npm run artifacts
      - name: Require every native binary
        run: |
          set -euo pipefail
          missing=0
          for name in \
            superglue-js.linux-x64-gnu.node \
            superglue-js.linux-arm64-gnu.node \
            superglue-js.darwin-arm64.node \
            superglue-js.darwin-x64.node
          do
            if ! find . -name "$name" -print -quit | grep -q .; then
              echo "Missing ${name}"
              missing=1
            fi
          done
          exit "$missing"
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

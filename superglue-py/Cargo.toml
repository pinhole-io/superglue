[package]
name = "superglue_py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for the superglue Rust core"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(Py_GIL_DISABLED)'] }

[lib]
name = "superglue_py"
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
prost = "0.14"
pyo3 = { version = "0.29", features = ["extension-module"] }
secrecy = "0.10"
serde_json = "1"
superglue = { path = "..", features = ["code", "mcp", "realtime"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[build-dependencies]
# none

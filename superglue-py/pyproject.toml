[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "superglue-py"
version = "0.1.0"
description = "Experimental Python bindings for the superglue Rust core"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[tool.maturin]
module-name = "superglue._superglue"
python-packages = ["superglue"]

[package]
name = "superglue_kt"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "Android JNI bindings for superglue (Kotlin)"
publish = false

[lib]
name = "superglue_kt"
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
jni = "0.21"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
superglue = { path = "../..", features = ["code", "mcp", "realtime"] }
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }

[target.'cfg(target_os = "android")'.dependencies]
# reqwest links rustls-platform-verifier, which uses jni 0.22.
# The JNI bindings themselves stay on jni 0.21.
jni22 = { package = "jni", version = "0.22.4" }
rustls-platform-verifier = "0.7.1"
